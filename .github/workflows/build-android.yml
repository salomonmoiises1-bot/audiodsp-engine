name: Build EQsb Android App & C++ DSP Engine

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Native DSP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708

      - name: Install Required Android SDK, NDK & CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Verify Android Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          ./gradlew --version

          echo "=== Android SDK ==="
          sdkmanager --version

          echo "=== Installed Required Packages ==="
          sdkmanager --list_installed

          echo "=== Verify Required Packages ==="
          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -d "$ANDROID_SDK_ROOT/build-tools/34.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"

          echo "Android SDK, NDK 26.1.10909125 and CMake 3.22.1 are installed."

      - name: Grant Execute Permission to Gradle Wrapper
        shell: bash
        run: chmod +x ./gradlew

      - name: Run Standalone Native C++ DSP Test Suite & Benchmark
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app/src/test/cpp/build
          mkdir -p app/src/test/cpp/build

          cd app/src/test/cpp/build

          cmake ..
          cmake --build . --parallel "$(nproc)"

          ./eqsb_native_tests

      - name: Clean Gradle Build
        shell: bash
        run: ./gradlew clean --stacktrace

      - name: Run Android Unit & Integration Tests
        shell: bash
        run: ./gradlew test --stacktrace

      - name: Assemble Debug APK with Native C++ DSP
        shell: bash
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_PATH"

          echo "Debug APK generated successfully:"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQsb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
